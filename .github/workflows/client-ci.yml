name: Client CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test team-manager flows
        run: npm run test:tm4:frontend
      - name: Test recruitment-manager flows
        run: npm run test:rm4:frontend
      - name: Test recruiter flows
        run: npm run test:r4:frontend
      - name: Build
        run: npm run build

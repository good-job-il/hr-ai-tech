name: Legacy API boundary

on:
  pull_request:
  push:
    branches: [main]

jobs:
  no-new-legacy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check frozen baseline against pull request base
        if: github.event_name == 'pull_request'
        run: node scripts/audit-legacy-api.mjs --check --baseline-ref="origin/${{ github.base_ref }}"
      - name: Check frozen baseline on main
        if: github.event_name != 'pull_request'
        run: npm run check:legacy-api
      - name: Check Phase 1 security boundary
        run: npm run check:phase-1-security
      - name: Check Phase 2 typed API contracts
        run: npm run check:phase-2-api
      - name: Check Phase 3 auth and tenant boundary
        run: npm run test:phase-3-boundary
      - name: Check Phase 4 public and candidate boundary
        run: npm run test:phase-4-public-candidate
      - name: Check Phase 5 employer, agency and CRM boundary
        run: npm run test:phase-5-b2b
      - name: Check Phase 6 functions, AI and import boundary
        run: npm run test:phase-6-operations
      - name: Check Phase 7 physical removal boundary
        run: npm run test:phase-7-removal

  phase-8-release:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: hire_israel
          MYSQL_USER: hire_user
          MYSQL_PASSWORD: hire_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u hire_user -phire_pass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: hire_israel
      DB_USER: hire_user
      DB_PASSWORD: hire_pass
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: rootpassword
      PORT: 3011
      NODE_ENV: test
      JWT_SECRET: phase8-ci-access-secret-change-me
      JWT_REFRESH_SECRET: phase8-ci-refresh-secret-change-me
      FRONTEND_URL: http://localhost:5174
      API_PUBLIC_URL: http://localhost:3011
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 2525
      PHASE8_MAIL_URL: http://127.0.0.1:2526/messages
      PHASE8_ADMIN_EMAIL: phase8-admin@example.test
      PHASE8_ADMIN_PASSWORD: Phase8-Admin-Pass-123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Production dependency security gate
        run: npm run audit:production
      - name: Frontend release gates
        run: npm run lint && npm run typecheck && npm run build && npm run test:phase-8-release
      - name: Backend unit, lint and build gates
        run: npm --prefix backend run lint && npm --prefix backend test -- --runInBand && npm --prefix backend run build
      - name: Fresh database migrations and seed
        run: npm --prefix backend run migration:run && npm --prefix backend run seed:taxonomy
      - name: Existing database upgrade and data preservation
        run: npm --prefix backend run test:phase-8-upgrade
      - name: Create isolated Phase 8 role fixtures
        run: npm run setup:phase-8-fixture
      - name: Start isolated SMTP fixture
        run: NODE_ENV=test node scripts/fake-smtp-server.mjs >/tmp/phase8-smtp.log 2>&1 &
      - name: Start QA API
        run: |
          cd backend
          NODE_OPTIONS=--require=${{ github.workspace }}/scripts/deny-legacy-platform-network.cjs node dist/main >/tmp/phase8-api.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3011/api/health && exit 0
            sleep 1
          done
          cat /tmp/phase8-api.log
          exit 1
      - name: OpenAPI, auth, tenant, workflow and job E2E
        run: npm run test:phase-8-api
      - name: Print API log on failure
        if: failure()
        run: cat /tmp/phase8-api.log || true

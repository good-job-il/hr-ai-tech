name: Production release sign-off

on:
  workflow_dispatch:

jobs:
  attest-external-release-controls:
    runs-on: ubuntu-latest
    environment: production
    env:
      BASE44_CREDENTIALS_REVOKED: ${{ vars.BASE44_CREDENTIALS_REVOKED }}
      BASE44_EGRESS_BLOCKED: ${{ vars.BASE44_EGRESS_BLOCKED }}
      BROWSER_MATRIX_VERIFIED: ${{ vars.BROWSER_MATRIX_VERIFIED }}
      BACKUP_RESTORE_VERIFIED: ${{ vars.BACKUP_RESTORE_VERIFIED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Require provider, network, browser and restore attestations
        run: npm run release:attest
